<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Logic Lagao</title>
   <link rel="icon" type="image/jpg" href="logo.jpg">
   <style>
      :root {
         --bg: #121212;
         --surface: #1a1a1a;
         --surface-2: #212121;
         --border: #2c2c2c;
         --text: #ededed;
         --text-dim: #9a9a9a;
         --accent: #e8b84b;
         --accent-dim: #6b5a2a;
         --done: #4caf82;
         --not-done: #d97a5f;
         --approved: #5aa9e6;
         --not-approved: #9a9a9a;
         --danger: #d9534f;
         --radius: 10px;
      }

      [data-theme="light"] {
         --bg: #f5f5f4;
         --surface: #ffffff;
         --surface-2: #f0f0ef;
         --border: #e0dfdc;
         --text: #1c1c1c;
         --text-dim: #6f6f6f;
         --accent: #b8860b;
         --accent-dim: #f1e2b8;
         --done: #2f8f63;
         --not-done: #c15f42;
         --approved: #2f7fc1;
         --not-approved: #6f6f6f;
         --danger: #c0392b;
      }

      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         background: var(--bg);
         color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      button {
         font-family: inherit;
         cursor: pointer;
      }

      input,
      textarea {
         font-family: inherit;
      }

      /* ---------- Login screen ---------- */
      #passwordScreen {
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 20px;
      }

      .pw-card {
         width: 100%;
         max-width: 340px;
         text-align: center;
      }

      .pw-title {
         font-size: 28px;
         font-weight: 700;
         letter-spacing: -0.5px;
         color: var(--accent);
         margin-bottom: 28px;
      }

      .pw-input {
         width: 100%;
         padding: 12px 14px;
         border-radius: var(--radius);
         border: 1px solid var(--border);
         background: var(--surface);
         color: var(--text);
         font-size: 15px;
         outline: none;
         margin-bottom: 12px;
      }

      #emailInput {
         width: 100%;
         padding: 12px 14px;
         border-radius: var(--radius);
         border: 1px solid var(--border);
         background: var(--surface);
         color: var(--text);
         font-size: 15px;
         outline: none;
         margin-bottom: 12px;
      }

      #emailInput:focus {
         border-color: var(--accent);
      }

      .pw-input:focus {
         border-color: var(--accent);
      }

      .pw-btn {
         width: 100%;
         padding: 12px 14px;
         border-radius: var(--radius);
         border: none;
         background: var(--accent);
         color: #1a1400;
         font-size: 15px;
         font-weight: 600;
      }

      .pw-error {
         color: var(--danger);
         font-size: 13px;
         margin-top: 10px;
         min-height: 16px;
      }

      /* ---------- Main app ---------- */
      #app {
         display: none;
         max-width: 720px;
         margin: 0 auto;
         padding: 20px 16px 60px;
      }

      .app-header {
         display: flex;
         align-items: center;
         justify-content: space-between;
         gap: 10px;
         margin: 4px 0 18px;
      }

      .site-title {
         font-size: 20px;
         font-weight: 700;
         color: var(--accent);
         margin: 0;
      }

      .logout-btn {
         background: transparent;
         border: 1px solid var(--border);
         color: var(--text-dim);
         padding: 6px 14px;
         border-radius: 999px;
         font-size: 13px;
      }

      .logout-btn:hover {
         color: var(--text);
         border-color: var(--accent);
      }

      .header-actions {
         display: flex;
         align-items: center;
         gap: 8px;
         flex-shrink: 0;
      }

      .theme-toggle-btn {
         width: 32px;
         height: 32px;
         border-radius: 50%;
         border: 1px solid var(--border);
         background: transparent;
         color: var(--text-dim);
         display: flex;
         align-items: center;
         justify-content: center;
         flex-shrink: 0;
         padding: 0;
      }

      .theme-toggle-btn:hover {
         color: var(--accent);
         border-color: var(--accent);
      }

      .theme-toggle-btn svg {
         width: 16px;
         height: 16px;
      }

      nav.tabs {
         display: flex;
         gap: 6px;
         border-bottom: 1px solid var(--border);
         margin-bottom: 18px;
      }

      .tab-btn {
         background: none;
         border: none;
         color: var(--text-dim);
         padding: 10px 4px;
         margin-right: 18px;
         font-size: 15px;
         font-weight: 600;
         border-bottom: 2px solid transparent;
      }

      .tab-btn.active {
         color: var(--text);
         border-bottom-color: var(--accent);
      }

      .view {
         display: none;
      }

      .view.active {
         display: block;
      }

      h2.section-heading {
         font-size: 14px;
         text-transform: uppercase;
         letter-spacing: 0.06em;
         color: var(--text-dim);
         margin: 0 0 12px;
      }

      /* Filters + add button row */
      .toolbar {
         display: flex;
         align-items: center;
         justify-content: space-between;
         gap: 10px;
         margin-bottom: 16px;
         flex-wrap: wrap;
      }

      .filters {
         display: flex;
         gap: 6px;
         flex-wrap: wrap;
      }

      .filter-btn {
         background: var(--surface);
         border: 1px solid var(--border);
         color: var(--text-dim);
         padding: 6px 12px;
         border-radius: 999px;
         font-size: 13px;
      }

      .filter-btn.active {
         background: var(--accent-dim);
         color: var(--accent);
         border-color: var(--accent-dim);
      }

      .add-btn {
         width: 34px;
         height: 34px;
         border-radius: 50%;
         border: none;
         background: var(--accent);
         color: #1a1400;
         font-size: 20px;
         line-height: 1;
         font-weight: 700;
         display: flex;
         align-items: center;
         justify-content: center;
         flex-shrink: 0;
      }

      /* Add-script form */
      .add-form {
         display: none;
         background: var(--surface);
         border: 1px solid var(--border);
         border-radius: var(--radius);
         padding: 16px;
         margin-bottom: 18px;
      }

      .add-form.active {
         display: block;
      }

      .add-form label {
         display: block;
         font-size: 12px;
         color: var(--text-dim);
         margin-bottom: 4px;
      }

      .add-form input,
      .add-form textarea {
         width: 100%;
         padding: 10px 12px;
         border-radius: 8px;
         border: 1px solid var(--border);
         background: var(--surface-2);
         color: var(--text);
         font-size: 14px;
         outline: none;
         margin-bottom: 12px;
         resize: vertical;
      }

      .add-form input:focus,
      .add-form textarea:focus {
         border-color: var(--accent);
      }

      .form-actions {
         display: flex;
         gap: 8px;
         justify-content: flex-end;
      }

      .btn {
         padding: 9px 16px;
         border-radius: 8px;
         border: none;
         font-size: 14px;
         font-weight: 600;
      }

      .btn-primary {
         background: var(--accent);
         color: #1a1400;
      }

      .btn-secondary {
         background: transparent;
         color: var(--text-dim);
         border: 1px solid var(--border);
      }

      /* Script cards */
      .script-card {
         display: flex;
         align-items: flex-start;
         gap: 12px;
         background: var(--surface);
         border: 1px solid var(--border);
         border-radius: var(--radius);
         padding: 14px;
         margin-bottom: 10px;
      }

      .status-checks {
         display: flex;
         flex-direction: column;
         gap: 8px;
         flex-shrink: 0;
         margin-top: 1px;
      }

      .status-check-item {
         display: flex;
         align-items: center;
         gap: 6px;
      }

      .status-check-item label {
         font-size: 11px;
         color: var(--text-dim);
         white-space: nowrap;
         cursor: pointer;
      }

      .script-checkbox {
         width: 18px;
         height: 18px;
         accent-color: var(--accent);
         flex-shrink: 0;
         cursor: pointer;
      }

      .script-body {
         flex: 1;
         min-width: 0;
      }

      .script-title {
         font-size: 15px;
         font-weight: 600;
         margin: 0 0 4px;
         word-break: break-word;
      }

      .script-title.done {
         text-decoration: line-through;
         color: var(--text-dim);
      }

      .script-desc {
         font-size: 13px;
         color: var(--text-dim);
         margin: 0 0 8px;
         word-break: break-word;
      }

      .script-meta {
         display: flex;
         align-items: center;
         gap: 8px;
         font-size: 12px;
         flex-wrap: wrap;
      }

      .status-badge {
         padding: 2px 9px;
         border-radius: 999px;
         font-weight: 600;
      }

      .status-badge.done {
         background: rgba(76, 175, 130, 0.15);
         color: var(--done);
      }

      .status-badge.not-done {
         background: rgba(217, 122, 95, 0.15);
         color: var(--not-done);
      }

      .status-badge.approved {
         background: rgba(90, 169, 230, 0.15);
         color: var(--approved);
      }

      .status-badge.not-approved {
         background: rgba(154, 154, 154, 0.15);
         color: var(--not-approved);
      }

      .date-text {
         color: var(--text-dim);
      }

      .delete-btn {
         background: none;
         border: none;
         color: var(--text-dim);
         font-size: 18px;
         line-height: 1;
         padding: 4px 6px;
         flex-shrink: 0;
      }

      .delete-btn:hover {
         color: var(--danger);
      }

      .edit-btn {
         background: none;
         border: none;
         color: var(--text-dim);
         font-size: 14px;
         line-height: 1;
         padding: 4px 6px;
         flex-shrink: 0;
      }

      .edit-btn:hover {
         color: var(--accent);
      }

      .card-actions {
         display: flex;
         gap: 2px;
         flex-shrink: 0;
      }

      .edit-form {
         flex: 1;
         min-width: 0;
      }

      .edit-form input,
      .edit-form textarea {
         width: 100%;
         padding: 8px 10px;
         border-radius: 8px;
         border: 1px solid var(--border);
         background: var(--surface-2);
         color: var(--text);
         font-size: 14px;
         outline: none;
         margin-bottom: 8px;
         resize: vertical;
      }

      .edit-form input:focus,
      .edit-form textarea:focus {
         border-color: var(--accent);
      }

      .edit-form-actions {
         display: flex;
         gap: 8px;
         justify-content: flex-end;
      }

      .empty-state {
         color: var(--text-dim);
         font-size: 14px;
         padding: 30px 0;
         text-align: center;
      }

      .inline-error {
         color: var(--danger);
         font-size: 12px;
         margin-top: 6px;
      }

      @media (max-width: 480px) {
         .toolbar {
            align-items: center;
         }

         .site-title {
            font-size: 18px;
         }
      }
   </style>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>

   <!-- PAGE 1: LOGIN -->
   <div id="passwordScreen">
      <div class="pw-card">
         <div class="pw-title">Logic Lagao</div>
         <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
         <input type="password" id="passwordInput" class="pw-input" placeholder="Password" autocomplete="off">
         <button class="pw-btn" id="enterBtn">Enter</button>
         <div class="pw-error" id="pwError"></div>
      </div>
   </div>

   <!-- PAGE 2: MAIN APP -->
   <div id="app">
      <div class="app-header">
         <div class="site-title">Logic Lagao</div>
         <div class="header-actions">
            <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle theme"
               aria-label="Toggle theme"></button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
         </div>
      </div>

      <nav class="tabs">
         <button class="tab-btn active" data-tab="home">Home</button>
         <button class="tab-btn" data-tab="scripts">Scripts</button>
      </nav>

      <!-- HOME VIEW -->
      <div class="view active" id="homeView">
         <h2 class="section-heading">Recently added</h2>
         <div id="homeList"></div>
      </div>

      <!-- SCRIPTS VIEW -->
      <div class="view" id="scriptsView">
         <div class="toolbar">
            <div class="filters">
               <button class="filter-btn active" data-filter="all">All</button>
               <button class="filter-btn" data-filter="not-approved">Not Approved</button>
               <button class="filter-btn" data-filter="approved">Approved</button>
               <button class="filter-btn" data-filter="not-done">Not Done</button>
               <button class="filter-btn" data-filter="done">Done</button>
            </div>
            <button class="add-btn" id="showAddFormBtn" title="Add script">+</button>
         </div>

         <div class="add-form" id="addForm">
            <label for="newTitle">Idea / Title</label>
            <input type="text" id="newTitle" placeholder="e.g. Why cats hate water">

            <label for="newDesc">Description</label>
            <textarea id="newDesc" rows="3" placeholder="Short description of the script"></textarea>

            <div class="form-actions">
               <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
               <button class="btn btn-primary" id="submitAddBtn">Add Script</button>
            </div>
         </div>

         <div id="scriptsList"></div>
      </div>
   </div>



   <script>
      /* ============================================================
         CONFIG
      ============================================================ */


      /* ============================================================
         THEME
         Applies and persists the dark/light theme. Runs immediately
         so the correct theme is set before the login screen shows.
      ============================================================ */
      const THEME_STORAGE_KEY = "logicLagaoTheme";

      const MOON_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
      const SUN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

      function getSavedTheme() {
         const saved = localStorage.getItem(THEME_STORAGE_KEY);
         return saved === "light" ? "light" : "dark"; // default to dark
      }

      function applyTheme(theme) {
         if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
         } else {
            document.documentElement.removeAttribute("data-theme");
         }
         localStorage.setItem(THEME_STORAGE_KEY, theme);

         const btn = document.getElementById("themeToggleBtn");
         if (btn) {
            // Icon shows the theme the click will switch TO,
            // per the requirement: moon while dark, sun while light.
            btn.innerHTML = theme === "light" ? SUN_ICON : MOON_ICON;
         }
      }

      let currentTheme = getSavedTheme();
      applyTheme(currentTheme);


      /* ============================================================
         DATA LAYER
         All data operations live here, backed by Supabase. The UI
         code below only calls these functions and never talks to
         Supabase directly, so the backend can be swapped again later
         without touching the UI. Every mutating function returns
         { error } (and, where relevant, the created/updated data) so
         the UI layer can do optimistic updates and roll back on
         failure without re-fetching everything.
      ============================================================ */
      const SUPABASE_URL = "https://lvsohmtmydjvuwiptvvs.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_07ljO6sChQRYpMyQGDEgLg_7RGz37RL";

      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const TABLE_NAME = "scripts";

      // Converts a Supabase row into the shape the UI expects.
      function _mapRow(row) {
         return {
            id: row.id,
            title: row.title,
            description: row.description || "",
            done: row.done,
            approved: row.approved,
            createdAt: row.created_at
         };
      }

      // Returns all scripts, newest first. Used only for the initial load.
      async function getScripts() {
         const {data, error} = await supabaseClient
            .from(TABLE_NAME)
            .select("*")
            .order("created_at", {ascending: false});

         if (error) {
            console.error("getScripts error:", error.message);
            return [];
         }
         return data.map(_mapRow);
      }

      // Adds a new script. Returns the created script (or null on failure).
      async function addScript(title, description) {
         const {data, error} = await supabaseClient
            .from(TABLE_NAME)
            .insert([{title: title, description: description, done: false, approved: false}])
            .select()
            .single();

         if (error) {
            console.error("addScript error:", error.message);
            return null;
         }
         return _mapRow(data);
      }

      // Toggles a script's done status. `currentDone` is the value before toggling.
      async function toggleDone(id, currentDone) {
         const {error} = await supabaseClient
            .from(TABLE_NAME)
            .update({done: !currentDone})
            .eq("id", id);

         if (error) {
            console.error("toggleDone error:", error.message);
         }
         return {error};
      }

      // Toggles a script's approved status. `currentApproved` is the value before toggling.
      async function toggleApproved(id, currentApproved) {
         const {error} = await supabaseClient
            .from(TABLE_NAME)
            .update({approved: !currentApproved})
            .eq("id", id);

         if (error) {
            console.error("toggleApproved error:", error.message);
         }
         return {error};
      }

      // Deletes a script by id.
      async function deleteScript(id) {
         const {error} = await supabaseClient
            .from(TABLE_NAME)
            .delete()
            .eq("id", id);

         if (error) {
            console.error("deleteScript error:", error.message);
         }
         return {error};
      }

      // Updates a script's title and description.
      async function updateScript(id, title, description) {
         const {error} = await supabaseClient
            .from(TABLE_NAME)
            .update({title: title, description: description})
            .eq("id", id);

         if (error) {
            console.error("updateScript error:", error.message);
         }
         return {error};
      }

      /* ============================================================
         UI STATE
         `allScripts` is the local, in-memory cache of every script,
         always kept newest-first. Supabase is only queried on
         initial load; every other operation reads/writes this array
         and patches the DOM directly.
      ============================================================ */
      let allScripts = [];
      let currentFilter = "all"; // all | approved | not-approved | done | not-done
      let editingId = null; // id of the script currently being edited, or null

      /* ============================================================
LOGIN SCREEN - SUPABASE AUTH
============================================================ */

      const passwordScreen = document.getElementById("passwordScreen");
      const appEl = document.getElementById("app");

      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const enterBtn = document.getElementById("enterBtn");
      const pwError = document.getElementById("pwError");
      const logoutBtn = document.getElementById("logoutBtn");
      const themeToggleBtn = document.getElementById("themeToggleBtn");

      themeToggleBtn.addEventListener("click", () => {
         currentTheme = currentTheme === "light" ? "dark" : "light";
         applyTheme(currentTheme);
      });

      async function tryEnter() {
         const email = emailInput.value.trim();
         const password = passwordInput.value;

         if (!email || !password) {
            pwError.textContent = "Enter email and password";
            return;
         }

         pwError.textContent = "";
         enterBtn.disabled = true;
         enterBtn.textContent = "Logging in...";

         const {error} = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
         });

         enterBtn.disabled = false;
         enterBtn.textContent = "Enter";

         if (error) {
            pwError.textContent = "Incorrect email or password";
            return;
         }

         showApp();
      }

      async function showApp() {
         passwordScreen.style.display = "none";
         appEl.style.display = "block";
         await loadInitialData();
      }

      function showLogin() {
         appEl.style.display = "none";
         passwordScreen.style.display = "flex";
         emailInput.value = "";
         passwordInput.value = "";
         pwError.textContent = "";
      }

      enterBtn.addEventListener("click", tryEnter);

      passwordInput.addEventListener("keydown", function (e) {
         if (e.key === "Enter") tryEnter();
      });

      emailInput.addEventListener("keydown", function (e) {
         if (e.key === "Enter") tryEnter();
      });

      logoutBtn.addEventListener("click", async () => {
         logoutBtn.disabled = true;
         await supabaseClient.auth.signOut();
         logoutBtn.disabled = false;
         showLogin();
      });

      /* Check if user is already logged in */
      async function checkExistingSession() {
         const {data} = await supabaseClient.auth.getSession();

         if (data.session) {
            showApp();
         }
      }

      checkExistingSession();

      /* ============================================================
         TABS
         Switching tabs never re-fetches from Supabase — it just
         re-renders from the local `allScripts` cache.
      ============================================================ */
      const tabButtons = document.querySelectorAll(".tab-btn");
      const views = {
         home: document.getElementById("homeView"),
         scripts: document.getElementById("scriptsView")
      };

      tabButtons.forEach(btn => {
         btn.addEventListener("click", () => {
            tabButtons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            Object.values(views).forEach(v => v.classList.remove("active"));
            views[btn.dataset.tab].classList.add("active");
            if (btn.dataset.tab === "home") renderHomeList();
            if (btn.dataset.tab === "scripts") renderScriptsList();
         });
      });

      /* ============================================================
         RENDER HELPERS
      ============================================================ */
      function formatDate(timestamp) {
         const d = new Date(timestamp);
         return d.toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"});
      }

      function escapeHtml(str) {
         const div = document.createElement("div");
         div.textContent = str;
         return div.innerHTML;
      }

      function scriptCardHtml(script, {withCheckboxes, withDelete, withEdit, editing}) {
         const doneClass = script.done ? "done" : "not-done";
         const doneText = script.done ? "Done" : "Not Done";
         const approvedClass = script.approved ? "approved" : "not-approved";
         const approvedText = script.approved ? "Approved" : "Not Approved";

         if (withEdit && editing) {
            return `
        <div class="script-card" data-id="${script.id}">
          <div class="edit-form">
            <input type="text" class="edit-title-input" value="${escapeHtml(script.title)}">
            <textarea class="edit-desc-input" rows="3">${escapeHtml(script.description)}</textarea>
            <div class="edit-form-actions">
              <button class="btn btn-secondary edit-cancel-btn">Cancel</button>
              <button class="btn btn-primary edit-save-btn">Save</button>
            </div>
          </div>
        </div>
      `;
         }

         return `
      <div class="script-card" data-id="${script.id}">
        ${withCheckboxes ? `
        <div class="status-checks">
          <div class="status-check-item">
            <input type="checkbox" class="approved-checkbox" id="approved-${script.id}" ${script.approved ? "checked" : ""}>
            <label for="approved-${script.id}">Approved</label>
          </div>
          <div class="status-check-item">
            <input type="checkbox" class="done-checkbox" id="done-${script.id}" ${script.done ? "checked" : ""}>
            <label for="done-${script.id}">Done</label>
          </div>
        </div>
        ` : ""}
        <div class="script-body">
          <p class="script-title ${script.done ? "done" : ""}">${escapeHtml(script.title)}</p>
          <p class="script-desc">${escapeHtml(script.description)}</p>
          <div class="script-meta">
            <span class="status-badge approved-badge ${approvedClass}">${approvedText}</span>
            <span class="status-badge done-badge ${doneClass}">${doneText}</span>
            <span class="date-text">${formatDate(script.createdAt)}</span>
          </div>
        </div>
        <div class="card-actions">
          ${withEdit ? `<button class="edit-btn" title="Edit">&#9998;</button>` : ""}
          ${withDelete ? `<button class="delete-btn" title="Delete">&times;</button>` : ""}
        </div>
      </div>
    `;
      }

      // Builds a detached DOM element for a script card (used for
      // inserting/replacing single cards without rebuilding lists).
      function buildCardElement(script, opts) {
         const wrapper = document.createElement("div");
         wrapper.innerHTML = scriptCardHtml(script, opts).trim();
         return wrapper.firstElementChild;
      }

      function showCardError(cardEl, message) {
         const container = cardEl.querySelector(".script-body") || cardEl.querySelector(".edit-form") || cardEl;
         let err = container.querySelector(".inline-error");
         if (!err) {
            err = document.createElement("div");
            err.className = "inline-error";
            container.appendChild(err);
         }
         err.textContent = message;
         setTimeout(() => {
            if (err && err.parentNode) err.remove();
         }, 3000);
      }

      function showFormError(message) {
         let err = addForm.querySelector(".inline-error");
         if (!err) {
            err = document.createElement("div");
            err.className = "inline-error";
            addForm.insertBefore(err, addForm.querySelector(".form-actions"));
         }
         err.textContent = message;
         setTimeout(() => {
            if (err && err.parentNode) err.remove();
         }, 3000);
      }

      function scriptMatchesCurrentFilter(script) {
         if (currentFilter === "done") return script.done;
         if (currentFilter === "not-done") return !script.done;
         if (currentFilter === "approved") return script.approved;
         if (currentFilter === "not-approved") return !script.approved;
         return true; // all
      }

      function updateBadgesAndTitle(cardEl, script) {
         const titleEl = cardEl.querySelector(".script-title");
         if (titleEl) titleEl.classList.toggle("done", script.done);

         const approvedBadge = cardEl.querySelector(".approved-badge");
         if (approvedBadge) {
            approvedBadge.classList.remove("approved", "not-approved");
            approvedBadge.classList.add(script.approved ? "approved" : "not-approved");
            approvedBadge.textContent = script.approved ? "Approved" : "Not Approved";
         }

         const doneBadge = cardEl.querySelector(".done-badge");
         if (doneBadge) {
            doneBadge.classList.remove("done", "not-done");
            doneBadge.classList.add(script.done ? "done" : "not-done");
            doneBadge.textContent = script.done ? "Done" : "Not Done";
         }
      }

      // Updates the badges/title on this script's card in both Home
      // and Scripts views (whichever of them currently exist in the DOM).
      function syncCardEverywhere(script) {
         const scriptsCard = scriptsList.querySelector(`.script-card[data-id="${script.id}"]`);
         if (scriptsCard) updateBadgesAndTitle(scriptsCard, script);

         const homeCard = homeList.querySelector(`.script-card[data-id="${script.id}"]`);
         if (homeCard) updateBadgesAndTitle(homeCard, script);
      }

      function removeEmptyState(container) {
         const empty = container.querySelector(".empty-state");
         if (empty) empty.remove();
      }

      function ensureEmptyStateIfNeeded(container, message) {
         if (!container.querySelector(".script-card")) {
            container.innerHTML = `<div class="empty-state">${message}</div>`;
         }
      }

      /* ============================================================
         HOME VIEW
         Rendered entirely from the local `allScripts` cache.
      ============================================================ */
      const homeList = document.getElementById("homeList");

      function renderHomeList() {
         if (allScripts.length === 0) {
            homeList.innerHTML = `<div class="empty-state">No scripts added yet.</div>`;
            return;
         }
         homeList.innerHTML = "";
         allScripts.forEach(script => {
            const cardEl = buildCardElement(script, {withCheckboxes: false, withDelete: false, withEdit: false, editing: false});
            homeList.appendChild(cardEl);
         });
      }

      /* ============================================================
         SCRIPTS VIEW
         Rendered entirely from the local `allScripts` cache, filtered
         in memory. Individual operations (toggle/add/edit/delete)
         patch this list directly instead of calling this function.
      ============================================================ */
      const scriptsList = document.getElementById("scriptsList");

      function getFilteredFromState() {
         if (currentFilter === "done") return allScripts.filter(s => s.done);
         if (currentFilter === "not-done") return allScripts.filter(s => !s.done);
         if (currentFilter === "approved") return allScripts.filter(s => s.approved);
         if (currentFilter === "not-approved") return allScripts.filter(s => !s.approved);
         return allScripts;
      }

      function renderScriptsList() {
         const scripts = getFilteredFromState();

         if (scripts.length === 0) {
            scriptsList.innerHTML = `<div class="empty-state">No scripts here.</div>`;
            return;
         }

         scriptsList.innerHTML = "";
         scripts.forEach(script => {
            const cardEl = buildCardElement(script, {
               withCheckboxes: true,
               withDelete: true,
               withEdit: true,
               editing: script.id === editingId
            });
            attachCardListeners(cardEl, script);
            scriptsList.appendChild(cardEl);
         });
      }

      /* ============================================================
         PER-CARD EVENT HANDLERS
         Each handler updates local state + the DOM directly, and
         only re-syncs with Supabase for its own single operation.
      ============================================================ */
      function attachCardListeners(cardEl, script) {
         const id = script.id;

         const approvedCheckbox = cardEl.querySelector(".approved-checkbox");
         if (approvedCheckbox) {
            approvedCheckbox.addEventListener("change", () => handleToggleApproved(id, cardEl));
         }

         const doneCheckbox = cardEl.querySelector(".done-checkbox");
         if (doneCheckbox) {
            doneCheckbox.addEventListener("change", () => handleToggleDone(id, cardEl));
         }

         const deleteBtn = cardEl.querySelector(".delete-btn");
         if (deleteBtn) {
            deleteBtn.addEventListener("click", () => handleDelete(id, cardEl));
         }

         const editBtn = cardEl.querySelector(".edit-btn");
         if (editBtn) {
            editBtn.addEventListener("click", () => handleEditStart(id));
         }

         const editCancelBtn = cardEl.querySelector(".edit-cancel-btn");
         if (editCancelBtn) {
            editCancelBtn.addEventListener("click", () => handleEditCancel(id));
         }

         const editSaveBtn = cardEl.querySelector(".edit-save-btn");
         if (editSaveBtn) {
            editSaveBtn.addEventListener("click", () => handleEditSave(id, cardEl));
         }
      }

      async function handleToggleApproved(id, cardEl) {
         const script = allScripts.find(s => s.id === id);
         if (!script) return;

         const checkbox = cardEl.querySelector(".approved-checkbox");
         const previousApproved = script.approved;
         const nextApproved = !previousApproved;

         // Optimistic update
         script.approved = nextApproved;
         if (checkbox) checkbox.disabled = true;
         syncCardEverywhere(script);

         const {error} = await toggleApproved(id, previousApproved);

         if (checkbox) checkbox.disabled = false;

         if (error) {
            // Revert on failure
            script.approved = previousApproved;
            if (checkbox) checkbox.checked = previousApproved;
            syncCardEverywhere(script);
            showCardError(cardEl, "Couldn't update Approved status.");
            return;
         }

         if (!scriptMatchesCurrentFilter(script)) {
            cardEl.remove();
            ensureEmptyStateIfNeeded(scriptsList, "No scripts here.");
         }
      }

      async function handleToggleDone(id, cardEl) {
         const script = allScripts.find(s => s.id === id);
         if (!script) return;

         const checkbox = cardEl.querySelector(".done-checkbox");
         const previousDone = script.done;
         const nextDone = !previousDone;

         // Optimistic update
         script.done = nextDone;
         if (checkbox) checkbox.disabled = true;
         syncCardEverywhere(script);

         const {error} = await toggleDone(id, previousDone);

         if (checkbox) checkbox.disabled = false;

         if (error) {
            // Revert on failure
            script.done = previousDone;
            if (checkbox) checkbox.checked = previousDone;
            syncCardEverywhere(script);
            showCardError(cardEl, "Couldn't update Done status.");
            return;
         }

         if (!scriptMatchesCurrentFilter(script)) {
            cardEl.remove();
            ensureEmptyStateIfNeeded(scriptsList, "No scripts here.");
         }
      }

      async function handleDelete(id, cardEl) {
         const deleteBtn = cardEl.querySelector(".delete-btn");
         if (deleteBtn) deleteBtn.disabled = true;

         const {error} = await deleteScript(id);

         if (error) {
            if (deleteBtn) deleteBtn.disabled = false;
            showCardError(cardEl, "Couldn't delete script.");
            return;
         }

         allScripts = allScripts.filter(s => s.id !== id);

         cardEl.remove();
         ensureEmptyStateIfNeeded(scriptsList, "No scripts here.");

         const homeCard = homeList.querySelector(`.script-card[data-id="${id}"]`);
         if (homeCard) homeCard.remove();
         ensureEmptyStateIfNeeded(homeList, "No scripts added yet.");
      }

      function handleEditStart(id) {
         const script = allScripts.find(s => s.id === id);
         const oldCard = scriptsList.querySelector(`.script-card[data-id="${id}"]`);
         if (!script || !oldCard) return;

         editingId = id;
         const newCard = buildCardElement(script, {withCheckboxes: true, withDelete: true, withEdit: true, editing: true});
         attachCardListeners(newCard, script);
         oldCard.replaceWith(newCard);
      }

      function handleEditCancel(id) {
         const script = allScripts.find(s => s.id === id);
         const oldCard = scriptsList.querySelector(`.script-card[data-id="${id}"]`);
         if (!script || !oldCard) return;

         editingId = null;
         const newCard = buildCardElement(script, {withCheckboxes: true, withDelete: true, withEdit: true, editing: false});
         attachCardListeners(newCard, script);
         oldCard.replaceWith(newCard);
      }

      async function handleEditSave(id, cardEl) {
         const titleInput = cardEl.querySelector(".edit-title-input");
         const descInput = cardEl.querySelector(".edit-desc-input");
         const newTitle = titleInput.value.trim();
         const newDesc = descInput.value.trim();

         if (!newTitle) {
            titleInput.focus();
            return;
         }

         const saveBtn = cardEl.querySelector(".edit-save-btn");
         const cancelBtn = cardEl.querySelector(".edit-cancel-btn");
         if (saveBtn) saveBtn.disabled = true;
         if (cancelBtn) cancelBtn.disabled = true;

         const {error} = await updateScript(id, newTitle, newDesc);

         if (error) {
            if (saveBtn) saveBtn.disabled = false;
            if (cancelBtn) cancelBtn.disabled = false;
            showCardError(cardEl, "Couldn't save changes.");
            return;
         }

         const script = allScripts.find(s => s.id === id);
         if (script) {
            script.title = newTitle;
            script.description = newDesc;
         }
         editingId = null;

         const newCard = buildCardElement(script, {withCheckboxes: true, withDelete: true, withEdit: true, editing: false});
         attachCardListeners(newCard, script);
         cardEl.replaceWith(newCard);

         const homeCard = homeList.querySelector(`.script-card[data-id="${id}"]`);
         if (homeCard) {
            const newHomeCard = buildCardElement(script, {withCheckboxes: false, withDelete: false, withEdit: false, editing: false});
            homeCard.replaceWith(newHomeCard);
         }
      }

      /* Filter buttons — re-render Scripts view from local state, no fetch. */
      document.querySelectorAll(".filter-btn").forEach(btn => {
         btn.addEventListener("click", () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            renderScriptsList();
         });
      });

      /* ============================================================
         ADD SCRIPT FORM
      ============================================================ */
      const addForm = document.getElementById("addForm");
      const showAddFormBtn = document.getElementById("showAddFormBtn");
      const cancelAddBtn = document.getElementById("cancelAddBtn");
      const submitAddBtn = document.getElementById("submitAddBtn");
      const newTitleInput = document.getElementById("newTitle");
      const newDescInput = document.getElementById("newDesc");

      showAddFormBtn.addEventListener("click", () => {
         addForm.classList.add("active");
         newTitleInput.focus();
      });

      cancelAddBtn.addEventListener("click", closeAddForm);

      function closeAddForm() {
         addForm.classList.remove("active");
         newTitleInput.value = "";
         newDescInput.value = "";
      }

      submitAddBtn.addEventListener("click", async () => {
         const title = newTitleInput.value.trim();
         const description = newDescInput.value.trim();

         if (!title) {
            newTitleInput.focus();
            return;
         }

         submitAddBtn.disabled = true;
         const newScript = await addScript(title, description);
         submitAddBtn.disabled = false;

         if (!newScript) {
            showFormError("Couldn't add script. Please try again.");
            return;
         }

         closeAddForm();

         // Newest first — this script is the newest, so it goes at the front.
         allScripts.unshift(newScript);

         if (scriptMatchesCurrentFilter(newScript)) {
            removeEmptyState(scriptsList);
            const newCard = buildCardElement(newScript, {withCheckboxes: true, withDelete: true, withEdit: true, editing: false});
            attachCardListeners(newCard, newScript);
            scriptsList.prepend(newCard);
         }

         removeEmptyState(homeList);
         const newHomeCard = buildCardElement(newScript, {withCheckboxes: false, withDelete: false, withEdit: false, editing: false});
         homeList.prepend(newHomeCard);
      });

      /* ============================================================
         INITIAL LOAD
         The only place that fetches everything from Supabase.
      ============================================================ */
      async function loadInitialData() {
         homeList.innerHTML = `<div class="empty-state">Loading...</div>`;
         scriptsList.innerHTML = `<div class="empty-state">Loading...</div>`;

         allScripts = await getScripts(); // already newest first

         renderHomeList();
         renderScriptsList();
      }
   </script>
</body>

</html>
